[package]
name = "openatatd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Always-on native OpenAtat applet (overlay, trigger, capture, insert)"

[dependencies]
openatat-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.8"
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wl-clipboard-rs = "0.9"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSString",
    "NSData",
    "NSURL",
    "NSDate",
    "NSThread",
    "NSError",
    "NSValue",
    "block2",
] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSWindow",
    "NSPanel",
    "NSView",
    "NSImage",
    "NSImageView",
    "NSEvent",
    "NSPasteboard",
    "NSWorkspace",
    "NSScreen",
    "NSColor",
    "NSControl",
    "NSResponder",
    "NSStatusBar",
    "NSStatusItem",
    "NSMenu",
    "NSMenuItem",
    "NSDragging",
    "NSBitmapImageRep",
    "block2",
] }
objc2-core-graphics = { version = "0.3.2", features = ["CGImage"] }
objc2-screen-capture-kit = { version = "0.3.2", features = [
    "SCScreenshotManager",
    "SCShareableContent",
    "SCStream",
    "block2",
] }
accessibility-sys = "0.2"
core-foundation = "0.10"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Match gpui-ce 0.3's windows crate era (0.61).
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_Media_MediaFoundation",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[dev-dependencies]
serde_json.workspace = true
