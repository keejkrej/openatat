[workspace]
resolver = "2"
members = [
    "crates/openatat-ipc",
    "crates/openatatd",
    "crates/openatat-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/keejkrej/openatat"
rust-version = "1.88"

[workspace.dependencies]
openatat-ipc = { path = "crates/openatat-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
